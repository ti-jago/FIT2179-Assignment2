<!DOCTYPE html>
<html>
<head>
  <title>Tourism to Australia Visualisation</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      font-family: Arial;
      margin: 40px;
    }

    .chart {
      margin-bottom: 60px;
    }
  </style>
</head>

<body>

<h1>Tourism to Australia (2024)</h1>

<h2>Where visitors come from</h2>
<div id="chart1" class="chart"></div>
<div id="chart2" class="chart"></div>

<h2>Visitor behaviour</h2>
<div id="chart3" class="chart"></div>

<script>
vegaEmbed('#chart1', 'charts/bar_top_countries.json');
vegaEmbed('#chart2', 'charts/map_visitors.json');
vegaEmbed('#chart3', 'charts/bubble_spend_stay.json');
</script>

</body>
</html>
