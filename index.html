<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FIT2179 Data Visualisation 2</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      max-width: 1000px;
    }
    h1 { margin-bottom: 40px; }
    .chart { margin-bottom: 70px; }
  </style>
</head>
<body>

<h1>Tourism to Australia Visualisation (2024)</h1>

<h2>Top Countries Visiting Australia</h2>
<div id="bar" class="chart"></div>

<h2>Visitor Spending vs Stay Duration</h2>
<div id="bubble" class="chart"></div>

<h2>Global Visitor Distribution</h2>
<div id="map" class="chart"></div>

<script>
  var DATA = "https://raw.githubusercontent.com/ti-jago/FIT2179-Assignment2/refs/heads/main/data/tourism2024_clean.csv";

  // BAR CHART
  vegaEmbed('#bar', {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "width": 500,
    "height": 320,
    "data": {"url": DATA},
    "transform": [
      {"filter": "datum.country !== 'Other Asia' && datum.country !== 'Other Europe' && datum.country !== 'Other Countries' && datum.country !== 'Scandinavia'"},
      {"calculate": "toNumber(datum.trips_2024)", "as": "trips_num"},
      {"window": [{"op": "rank", "as": "rank"}], "sort": [{"field": "trips_num", "order": "descending"}]},
      {"filter": "datum.rank <= 10"}
    ],
    "mark": "bar",
    "encoding": {
      "y": {"field": "country", "type": "nominal", "sort": {"field": "rank", "order": "ascending"}, "title": "Country"},
      "x": {"field": "trips_num", "type": "quantitative", "title": "Visitor Trips (thousands)"},
      "color": {"field": "trips_num", "type": "quantitative", "scale": {"scheme": "tealblues"}, "legend": null},
      "tooltip": [
        {"field": "country", "type": "nominal", "title": "Country"},
        {"field": "trips_num", "type": "quantitative", "title": "Trips (000s)", "format": ","}
      ]
    }
  }, {"actions": false});

  // BUBBLE CHART
  vegaEmbed('#bubble', {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "width": 500,
    "height": 400,
    "data": {"url": DATA},
    "transform": [
      {"filter": "datum.country !== 'Other Asia' && datum.country !== 'Other Europe' && datum.country !== 'Other Countries'"},
      {"calculate": "toNumber(datum.nights_2024)", "as": "nights_num"},
      {"calculate": "toNumber(datum.spend_2024)", "as": "spend_num"},
      {"calculate": "toNumber(datum.trips_2024)", "as": "trips_num"}
    ],
    "mark": {"type": "point", "filled": true, "opacity": 0.8},
    "encoding": {
      "x": {"field": "nights_num", "type": "quantitative", "title": "Total Nights (thousands)"},
      "y": {"field": "spend_num", "type": "quantitative", "title": "Total Spend ($M AUD)"},
      "size": {"field": "trips_num", "type": "quantitative", "title": "Trips (000s)", "scale": {"range": [50, 2000]}},
      "color": {"field": "country", "type": "nominal", "scale": {"scheme": "tableau10"}, "legend": {"title": "Country"}},
      "tooltip": [
        {"field": "country", "type": "nominal", "title": "Country"},
        {"field": "trips_num", "type": "quantitative", "title": "Trips (000s)", "format": ","},
        {"field": "nights_num", "type": "quantitative", "title": "Nights (000s)", "format": ","},
        {"field": "spend_num", "type": "quantitative", "title": "Spend ($M)", "format": ","}
      ]
    }
  }, {"actions": false});

  // MAP
  vegaEmbed('#map', {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "width": 700,
    "height": 420,
    "projection": {"type": "naturalEarth1"},
    "layer": [
      {
        "data": {
          "url": "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
          "format": {"type": "topojson", "feature": "countries"}
        },
        "mark": {"type": "geoshape", "fill": "#d9d9d9", "stroke": "white", "strokeWidth": 0.5}
      },
      {
        "data": {
          "url": "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
          "format": {"type": "topojson", "feature": "countries"}
        },
        "transform": [
          {
            "lookup": "properties.name",
            "from": {
              "data": {"url": DATA},
              "key": "country",
              "fields": ["trips_2024", "spend_2024", "country"]
            }
          },
          {"filter": "datum.trips_2024 != null"}
        ],
        "mark": {"type": "geoshape", "stroke": "white", "strokeWidth": 0.5},
        "encoding": {
          "color": {
            "field": "trips_2024",
            "type": "quantitative",
            "scale": {"scheme": "tealblues", "type": "log"},
            "legend": {"title": "Trips (000s)"}
          },
          "tooltip": [
            {"field": "country", "type": "nominal", "title": "Country"},
            {"field": "trips_2024", "type": "quantitative", "title": "Trips (000s)", "format": ","},
            {"field": "spend_2024", "type": "quantitative", "title": "Spend ($M)", "format": ","}
          ]
        }
      }
    ]
  }, {"actions": false});
</script>

</body>
</html>
